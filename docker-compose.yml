version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: aibank_chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    networks:
      - aibank_net

  postgres:
    image: postgres:15-alpine
    container_name: aibank_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aibank
      POSTGRES_PASSWORD: aibankpassword
      POSTGRES_DB: aibank_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aibank_net

volumes:
  chroma_data:
  postgres_data:

networks:
  aibank_net:
    driver: bridge
